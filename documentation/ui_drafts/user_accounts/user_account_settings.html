<!DOCTYPE>
<html>
  <head>
    <link rel="stylesheet" href = "user_account.css"/>
  </head>
  <body>
    <div id = "main">
      <div id = "user-account">
        <div id = "profile">
          <img class = "picture" width = "64" height = "64" src="./assets/pfp.png"/>
          <span class = "name">Freyja-moth</span>
        </div>

        <div id = "account">
          <div id = "button-row">
            <button class = "boxed-item hide-background page-button">
              Posts
            </button>
            <button class = "boxed-item hide-background page-button">
              Scripts
            </button>
            <button class = "boxed-item hide-background page-button">
              Audio
            </button>
            <button class = "boxed-item hide-background page-button">
              Settings
            </button>
          </div>

          <hr width = "100%">

          <h2>Settings</h2>

          <div id = "settings">
            <div id = "browsing">
              <h3>Browsing</h3>
              <hr width="100%"/>

              <h4>Global Excluded Tags</h4>
              <div class = "boxed-item global-excluded-tags">
                <span class = "boxed-item global-excluded-tag">[Tag1]</span>
                <span class = "boxed-item global-excluded-tag">[Tag2]</span>
                <button class = "boxed-item hide-background">+</span>
              </div>
            </div>

            <div id = "creating">
              <h3>Creating</h3>
              <hr width="100%"/>
              <div class = "choice">
                <button class = "boxed-item checkbox"></button>
                <span class = "checkbox-choice">Allow users to download content</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
