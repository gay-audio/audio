[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.3.2", features = ["postgres", "r2d2", "uuid"] }
actix-web = "4.11.0"

serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.15.0"
toml = "0.9.7"

anyhow = "1.0.100"

mime = "0.3.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
derive_more = { version = "2.0.1", features = ["deref", "deref_mut", "display", "from_str", "try_from"] }
digest = "0.10.7"
ron = "0.11.0"
serde_json = "1.0.145"
lazy_static = "1.5.0"
log = "0.4.28"
thiserror = "2.0.17"
audio_data = { version = "0.1.0", path = "../crates/audio_data" }
futures-core = "0.3.31"
actix-http = "3.11.2"
paste = "1.0.15"
